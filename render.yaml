services:
  - type: web
    name: unwalked-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ConnectionStrings__Unwalked
        sync: false
      - key: Jwt__SigningKey
        generateValue: true
      - key: PORT
        value: "8080"
